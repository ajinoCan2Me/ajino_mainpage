
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APEX Ranked Map Rotation</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #10141d;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 500px;
  margin: 30px auto;
  background: #1b2230;
  border: 1px solid #394355;
  border-radius: 14px;
  overflow: hidden;
}

.header {
  padding: 18px;
  text-align: center;
  background: #e84141;
  font-weight: bold;
  letter-spacing: 2px;
}

.section {
  padding: 25px 15px;
  text-align: center;
}

.label {
  color: #9ba7ba;
  font-size: 12px;
  letter-spacing: 2px;
  margin-bottom: 10px;
}

.map-name {
  font-size: 30px;
  font-weight: bold;
  margin-bottom: 25px;
}

.timer {
  color: #65e6c4;
  font-size: 36px;
  font-weight: bold;
  font-variant-numeric: tabular-nums;
}

.switch {
  margin-top: 12px;
  color: #c3cbd8;
  font-size: 13px;
}

.next {
  background: #252e3d;
  border-top: 1px solid #394355;
}

.next .map-name {
  color: #f5c76a;
  margin-bottom: 0;
}

.footer {
  padding: 12px;
  text-align: center;
  font-size: 11px;
  color: #8793a6;
}

.error {
  color: #ff7777;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    APEX RANKED ROTATION
  </div>

  <div class="section">

    <div class="label">CURRENT MAP</div>
    <div id="current-map" class="map-name">
      Loading...
    </div>

    <div class="label">REMAINING TIME</div>
    <div id="timer" class="timer">
      --:--:--
    </div>

    <div class="switch">
      切り替え時間：
      <span id="switch-time">--</span>
    </div>

  </div>

  <div class="section next">

    <div class="label">NEXT MAP</div>
    <div id="next-map" class="map-name">
      Loading...
    </div>

  </div>

  <div class="footer" id="updated">
    データ取得中...
  </div>

</div>

<script>
const JSON_URL = "./data/ranked-map.json";

let endTime = null;

const el = id => document.getElementById(id);

// 日本時間で日時を表示
function formatDate(date) {
  return new Intl.DateTimeFormat("ja-JP", {
    timeZone: "Asia/Tokyo",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    hour12: false
  }).format(date);
}

// 残り時間を表示
function countdown() {
  if (!endTime) return;

  const remaining = Math.max(
    0,
    Math.floor((endTime - Date.now()) / 1000)
  );

  const days = Math.floor(remaining / 86400);
  const hours = Math.floor((remaining % 86400) / 3600);
  const minutes = Math.floor((remaining % 3600) / 60);
  const seconds = remaining % 60;

  let result;

  if (days > 0) {
    result = `${days}日 ${hours}時間 ${minutes}分 ${seconds}秒`;
  } else {
    result = [
      String(hours).padStart(2, "0"),
      String(minutes).padStart(2, "0"),
      String(seconds).padStart(2, "0")
    ].join(":");
  }

  el("timer").textContent = result;
}

// JSONを取得
async function loadMap() {
  try {
    const response = await fetch(
      JSON_URL + "?t=" + Date.now(),
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("JSON取得失敗: " + response.status);
    }

    const data = await response.json();

    if (
      !data.current?.name ||
      !data.next?.name ||
      !data.current?.ends_at
    ) {
      throw new Error("JSONの形式が正しくありません");
    }

    const parsedEnd = Date.parse(data.current.ends_at);

    if (!Number.isFinite(parsedEnd)) {
      throw new Error("終了時刻が不正です");
    }

    endTime = parsedEnd;

    el("current-map").textContent =
      data.current.name;

    el("next-map").textContent =
      data.next.name;

    el("switch-time").textContent =
      formatDate(new Date(endTime));

    el("updated").textContent =
      "最終更新：" +
      formatDate(new Date(data.fetched_at || Date.now()));

    el("updated").classList.remove("error");

    countdown();

  } catch (error) {
    console.error(error);

    el("updated").textContent =
      "データ取得失敗：" + error.message;

    el("updated").classList.add("error");
  }
}

// 初回読み込み
loadMap();

// カウントダウンは毎秒更新
setInterval(countdown, 1000);

// JSONは60秒ごとに再取得
setInterval(loadMap, 60000);

</script>

</body>
</html>
