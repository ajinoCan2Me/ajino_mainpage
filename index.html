
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APEX MAIN PAGE</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- 左側固定メニュー -->
  <aside class="sidebar">
    <div class="logo">APEX<span>.</span></div>
    <p class="menu-title">MENU</p>

    <div class="button-container">
      <button onclick="changePage('/ajino_mainpage/main/')">TOP</button>
      <button onclick="changePage('/ajino_mainpage/score/')">戦績作成</button>
      <button onclick="changePage('https://ajinocan2me.github.io/apex_recruiting/')">えぺぼ</button>
      <button onclick="changePage('/ajino_mainpage/division/')">チーム分け</button>
      <button onclick="changePage('https://ajinoCan2Me.github.io/LegendPick/')">ランダムレジェンドピック</button>
    </div>

    <div class="sidebar-footer">
      APEX PORTAL
    </div>
  </aside>

  <!-- 右側メイン画面 -->
  <main class="main-content">
    <div class="iframe-container">
      <iframe
        id="Flame"
        src="./main/"
        title="APEX Content">
      </iframe>
    </div>
  </main>

  
<script>
const sites = [
    "https://ajinocan2me.github.io/apex_recruiting/",
    "https://ajinocan2me.github.io/LegendPick/",
    "https://ajinocan2me.github.io/ApexTeam/"
];

function changeSite(index) {
    if (index < 0 || index >= sites.length) {
        console.error("無効なサイト番号です:", index);
        return;
    }

    // 選択したサイトへ直接移動
    window.location.href = sites[index];
}
</script>

    
</body>
</html>
