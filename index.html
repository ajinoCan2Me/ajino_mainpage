
<!DOCTYPE html>
<html lang="ja">
<head>
  
</head>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .button-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      flex-shrink: 0;
      background: #222;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #444;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #666;
    }

    .iframe-container {
      flex: 1;
      min-height: 0;
      width: 100%;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }

    @media screen and (max-width: 600px) {
      .button-container {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 6px;
        padding: 6px;
      }

      button {
        width: 100%;
        padding: 12px 4px;
        font-size: 14px;
      }
    }
  </style>
<body>

  <div class="button-container">
    <button onclick="changePage('./score/')">戦績作成</button>
    <button onclick="changePage('https://ajinocan2me.github.io/apex_recruiting/')">えぺぼ</button>
    <button onclick="changePage('https://ajinoCan2Me.github.io/ApexTeam/')">チーム分け</button>
    <button onclick="changePage('https://ajinoCan2Me.github.io/LegendPick/')">ランダムレジェンドピック</button>
  </div>
  
  <br></br>
  
  <div class="iframe-container">
  <iframe
    id="Flame"
    src="https://ajinocan2me.github.io/apex_recruiting/"
  >
  </iframe>
  </div>

  <script>
    function changePage(page){
      document.getElementById('Flame').src = page;
    }
  </script>

  
</body>
</html>
