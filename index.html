
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PREMIUM PORTAL</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <div class="logo">APEX<span>.</span></div>
    <div class="status">● SYSTEM ONLINE</div>
</header>

<main class="main">

    <p class="subtitle">PREMIUM DIGITAL EXPERIENCE</p>

    <h1>SELECT YOUR<br>DESTINATION.</h1>

    <p class="description">
        お好みのコンテンツを選択してください。
    </p>

    <!-- JSONからボタンを生成 -->
    <div class="site-buttons" id="siteButtons">
        読み込み中...
    </div>

    <!-- プレビュー -->
    <section class="preview">

        <div class="preview-header">

            <span class="preview-title" id="siteTitle">
                SELECT A SITE
            </span>

            <span class="connected" id="connectionStatus">
                ● WAITING
            </span>

        </div>

        <iframe
            id="viewer"
            src="about:blank"
            title="サイトプレビュー">
        </iframe>

    </section>

</main>

<script>

let sites = [];

const buttons = document.getElementById("siteButtons");
const viewer = document.getElementById("viewer");
const siteTitle = document.getElementById("siteTitle");
const status = document.getElementById("connectionStatus");

// JSON読み込み
async function loadSites() {

    try {

        const response = await fetch("./pages.json");

        if (!response.ok) {
            throw new Error("JSON読み込みエラー");
        }

        const data = await response.json();

        sites = data.sites.filter(site =>
            site.enabled === true &&
            site.name &&
            site.url &&
            /^https:\/\/ajinocan2me\.github\.io\//i.test(site.url)
        );

        if (sites.length === 0) {
            throw new Error("表示できるサイトがありません");
        }

        // ボタンを自動生成
        buttons.innerHTML = "";

        sites.forEach((site, index) => {

            const button = document.createElement("button");

            button.className = "site-btn";
            button.textContent = site.name;

            button.addEventListener("click", () => {
                changeSite(index);
            });

            buttons.appendChild(button);

        });

        // 最初のサイトを表示
        changeSite(0);

    } catch (error) {

        console.error(error);

        buttons.textContent =
            "サイト一覧の読み込みに失敗しました。";

        status.textContent = "● ERROR";

    }

}

// サイト切り替え
function changeSite(index) {

    const site = sites[index];

    if (!site) return;

    viewer.src = site.url;

    siteTitle.textContent =
        site.name + " / PREVIEW";

    status.textContent = "● CONNECTED";

    // 選択中のボタンを変更
    document.querySelectorAll(".site-btn")
        .forEach((button, i) => {

            button.classList.toggle(
                "active",
                i === index
            );

        });

}

// 起動
loadSites();

</script>

</body>
</html>
