
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>サイト切り替え</title>

<style>
body {
    margin: 0;
    font-family: sans-serif;
}

.buttons {
    display: flex;
    gap: 10px;
    padding: 15px;
}

button {
    flex: 1;
    padding: 15px 5px;
    border: none;
    background: #333;
    color: white;
    border-radius: 8px;
    cursor: pointer;
}

button.active {
    background: #007bff;
}

iframe {
    width: 100%;
    height: calc(100vh - 75px);
    border: none;
}
</style>
</head>

<body>

<div class="buttons">
    <button onclick="changeSite(0)" class="active">サイト1</button>
    <button onclick="changeSite(1)">サイト2</button>
    <button onclick="changeSite(2)">サイト3</button>
</div>

<iframe id="viewer"
    src="https://example.com">
</iframe>

<script>
const sites = [
    "https://ajinocan2me.github.io/apex_recruiting/",
    "https://ajinocan2me.github.io/LegendPick/",
    "https://ajinocan2me.github.io/ApexTeam/"
];

function changeSite(index) {
    document.getElementById("viewer").src = sites[index];

    document.querySelectorAll("button").forEach((btn, i) => {
        btn.classList.toggle("active", i === index);
    });
}
</script>

</body>
</html>
