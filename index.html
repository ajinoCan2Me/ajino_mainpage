
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3サイト埋め込み</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: sans-serif;
    background: #f5f5f5;
}

.site-container {
    width: 100%;
    padding: 10px;
}

.site {
    width: 100%;
    margin-bottom: 20px;
    background: #fff;
    border-radius: 8px;
    overflow: hidden;
}

.site h2 {
    padding: 12px;
    font-size: 18px;
    background: #333;
    color: white;
}

iframe {
    width: 100%;
    height: 500px;
    border: none;
    display: block;
}

@media (max-width: 600px) {
    iframe {
        height: 400px;
    }
}
</style>
</head>

<body>

<div class="site-container">

    <!-- サイト1 -->
    <div class="site">
        <h2>サイト1</h2>
        <iframe src="https://ajinocan2me.github.io/apex_recruiting/"></iframe>
    </div>

    <!-- サイト2 -->
    <div class="site">
        <h2>サイト2</h2>
        <iframe src="https://example.org"></iframe>
    </div>

    <!-- サイト3 -->
    <div class="site">
        <h2>サイト3</h2>
        <iframe src="https://example.net"></iframe>
    </div>

</div>

</body>
</html>
